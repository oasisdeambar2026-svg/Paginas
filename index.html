<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Buscador de referencias de tubería</title>
<style>
:root{--bg:#f5f6f8;--surface:#fff;--text:#1d2330;--muted:#5d6676;--border:#d8dce3;--accent:#2a5fd8;--accent-text:#fff;--hover:#eef3fc;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181e;--surface:#1e232b;--text:#e7eaf0;--muted:#9aa3b2;--border:#333a46;--accent:#5b8cf0;--accent-text:#0b1220;--hover:#252c38;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15181e;--surface:#1e232b;--text:#e7eaf0;--muted:#9aa3b2;--border:#333a46;--accent:#5b8cf0;--accent-text:#0b1220;--hover:#252c38;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px)}
main{max-width:980px;margin:0 auto;padding:20px 0}
h1{font-size:1.4rem;margin:0 0 4px}
.sub{color:var(--muted);font-size:.9rem;margin:0 0 18px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
label{display:block;font-size:.85rem;font-weight:600;margin-bottom:6px}
input{width:100%;padding:10px 12px;font-size:1rem;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text)}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
.hint{font-size:.75rem;color:var(--muted);margin-top:4px}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
button{padding:10px 18px;font-size:1rem;border-radius:8px;border:1px solid var(--border);cursor:pointer;background:var(--surface);color:var(--text)}
button.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-weight:600}
button:hover{filter:brightness(.97)}
.status{margin:16px 0 8px;font-size:.92rem;color:var(--muted)}
.error{color:#c0392b;font-size:.92rem;margin-top:10px}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--border);vertical-align:top}
th{background:var(--bg);font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--hover)}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;white-space:nowrap}
.tag{display:inline-block;font-size:.72rem;padding:2px 7px;border-radius:999px;border:1px solid var(--border);color:var(--muted);white-space:nowrap}
.num{text-align:right;white-space:nowrap}
.empty{padding:28px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1>Buscador de referencias de tubería</h1>
  <p class="sub">Ingresa espesor, longitud y diámetro. Deja en blanco los campos que no quieras usar.</p>

  <section class="card">
    <div class="grid">
      <div>
        <label for="esp">Espesor (mm)</label>
        <input id="esp" type="number" step="0.01" min="0" inputmode="decimal" placeholder="Ej. 1.0">
        <div class="hint">Tolerancia ± 0.1 mm</div>
      </div>
      <div>
        <label for="lon">Longitud (mm)</label>
        <input id="lon" type="number" step="1" min="0" inputmode="numeric" placeholder="Ej. 363">
        <div class="hint">Tolerancia ± 1 mm</div>
      </div>
      <div>
        <label for="diam">Diámetro (mm)</label>
        <input id="diam" type="number" step="0.01" min="0" inputmode="decimal" placeholder="Ej. 22.2">
        <div class="hint">Tolerancia ± 0.2 mm</div>
      </div>
    </div>
    <div class="actions">
      <button class="primary" id="btnBuscar" type="button">Buscar</button>
      <button id="btnLimpiar" type="button">Limpiar</button>
    </div>
    <div class="error" id="error" role="alert"></div>
  </section>

  <div class="status" id="status"></div>

  <div class="table-wrap" id="resultados" hidden>
    <table>
      <thead>
        <tr>
          <th>Referencia</th>
          <th>Pieza / descripción</th>
          <th class="num">Longitud (mm)</th>
          <th class="num">Diámetro (mm)</th>
          <th class="num">Espesor (mm)</th>
          <th>Origen</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</main>

const $ = id => document.getElementById(id);
const TOL = { esp: 0.1, lon: 1, diam: 0.2 };

function leer(id) {
  const v = $(id).value.trim();
  if (v === '') return null;
  const n = Number(v.replace(',', '.'));
  return Number.isFinite(n) ? n : NaN;
}

function cerca(valor, objetivo, tol) {
  return valor !== null && valor !== undefined && Math.abs(valor - objetivo) <= tol + 1e-9;
}

function filas() {
  const cortes = DATA.cortes.map(c => ({
    ref: c.mp, pieza: c.pieza, desc: c.piezaDesc || c.ptDesc || '',
    lon: c.longitud, diam: c.diamMm, esp: c.espMm, origen: 'Hoja de cortes'
  }));
  const longs = DATA.longitudes.map(l => ({
    ref: l.item, pieza: l.ref || '', desc: l.material || '',
    lon: l.longitud, diam: l.diamMm, esp: l.espMm, origen: 'Longitud de tubería'
  }));
  return cortes.concat(longs);
}

function buscar() {
  $('error').textContent = '';
  const esp = leer('esp'), lon = leer('lon'), diam = leer('diam');

  if ([esp, lon, diam].some(v => Number.isNaN(v))) {
    $('error').textContent = 'Revisa los valores: deben ser números.';
    return;
  }
  if (esp === null && lon === null && diam === null) {
    $('error').textContent = 'Ingresa al menos un valor para buscar.';
    return;
  }

  const res = filas().filter(f =>
    (esp === null || cerca(f.esp, esp, TOL.esp)) &&
    (lon === null || cerca(f.lon, lon, TOL.lon)) &&
    (diam === null || cerca(f.diam, diam, TOL.diam))
  );

  mostrar(res);
}

function mostrar(res) {
  const tbody = $('tbody');
  tbody.innerHTML = '';
  $('resultados').hidden = false;

  if (res.length === 0) {
    $('status').textContent = '';
    tbody.innerHTML = '<tr><td colspan="6" class="empty">No se encontraron referencias con esos valores.</td></tr>';
    return;
  }

  $('status').textContent = res.length === 1 ? '1 resultado' : res.length + ' resultados';
  const fmt = v => (v === null || v === undefined) ? '—' : v;

  for (const f of res) {
    const tr = document.createElement('tr');
    tr.innerHTML =
      `<td class="code"></td><td></td><td class="num"></td><td class="num"></td><td class="num"></td><td><span class="tag"></span></td>`;
    const t = tr.children;
    t[0].textContent = f.ref || '—';
    t[1].innerHTML = '';
    const pieza = document.createElement('div');
    pieza.className = 'code';
    pieza.textContent = f.pieza || '';
    const d = document.createElement('div');
    d.textContent = f.desc;
    t[1].append(pieza, d);
    t[2].textContent = fmt(f.lon);
    t[3].textContent = fmt(f.diam);
    t[4].textContent = fmt(f.esp);
    t[5].firstChild.textContent = f.origen;
    tbody.appendChild(tr);
  }
}

function limpiar() {
  ['esp', 'lon', 'diam'].forEach(id => $(id).value = '');
  $('error').textContent = '';
  $('status').textContent = '';
  $('resultados').hidden = true;
  $('tbody').innerHTML = '';
  $('esp').focus();
}

$('btnBuscar').addEventListener('click', buscar);
$('btnLimpiar').addEventListener('click', limpiar);
['esp', 'lon', 'diam'].forEach(id =>
  $(id).addEventListener('keydown', e => { if (e.key === 'Enter') buscar(); })
);
</script>
